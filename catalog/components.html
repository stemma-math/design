<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Stemma design: components</title>
        <link rel="icon" href="../targets/brand-kit/web/favicon.svg" />
        <link rel="stylesheet" href="../targets/web/index.css" />
        <link rel="stylesheet" href="catalog.css" />
        <script type="module" src="catalog.js"></script>
    </head>
    <body>
        <main class="catalog-main">
            <h1>Components</h1>
            <p class="lead">
                Every component in <code class="identifier">components.css</code>, comfortable on
                the left and compact on the right.
            </p>

            <template id="set">
                <h3 class="label">Buttons</h3>
                <div class="catalog-row">
                    <button class="button">Secondary</button>
                    <button class="button button--primary">Primary</button>
                    <button class="button button--quiet">Quiet</button>
                    <button class="button button--link">Link</button>
                    <button class="button" disabled>Disabled</button>
                    <button class="button button--icon" aria-label="Settings">
                        <svg class="glyph" aria-hidden="true">
                            <use href="../targets/web/glyphs.svg#settings" />
                        </svg>
                    </button>
                </div>
                <div class="catalog-row">
                    <button class="button button--success">Success</button>
                    <button class="button button--warning">Warning</button>
                    <button class="button button--danger">Danger</button>
                    <button class="button button--primary button--success">Sign</button>
                    <button class="button button--primary button--danger">Delete</button>
                    <button class="button button--small">Small</button>
                    <button class="button button--small button--primary">Small primary</button>
                </div>
                <h3 class="label">Fields</h3>
                <div class="field">
                    <label class="field__label">Name</label>
                    <input class="input" placeholder="A placeholder" />
                    <span class="field__hint">A hint, under the field.</span>
                </div>
                <div class="field" style="margin-top: var(--space-3)">
                    <label class="field__label">Identifier</label>
                    <input class="input input--mono" value="thm:" aria-invalid="true" />
                    <span class="field__error"
                        ><svg class="glyph glyph--small" aria-hidden="true">
                            <use href="../targets/web/glyphs.svg#alert" /></svg
                        >An identifier needs a name after its colon.</span
                    >
                </div>
                <div class="catalog-row" style="margin-top: var(--space-3)">
                    <stemma-select>
                        <select class="input" aria-label="Kind">
                            <option>Theorem</option>
                            <option selected>Lemma</option>
                            <option>Corollary</option>
                            <optgroup label="Others">
                                <option>Definition</option>
                                <option>Remark</option>
                                <option disabled>Conjecture</option>
                            </optgroup>
                        </select>
                    </stemma-select>
                    <select class="input" style="width: auto" aria-label="Native">
                        <option>Without script</option>
                    </select>
                </div>
                <div class="catalog-row">
                    <label class="choice"><input type="checkbox" checked /> Checked</label>
                    <label class="choice"><input type="checkbox" /> Not</label>
                    <label class="choice"><input type="radio" name="r" checked /> One</label>
                    <label class="choice"><input type="radio" name="r" /> Two</label>
                    <label class="choice"><input type="checkbox" role="switch" checked /> On</label>
                    <label class="choice"><input type="checkbox" role="switch" /> Off</label>
                </div>
                <fieldset class="fieldset">
                    <legend>A set of choices</legend>
                    <label class="choice"><input type="checkbox" checked /> Comments</label>
                    <label class="choice"><input type="checkbox" /> Mentions</label>
                </fieldset>
                <h3 class="label">Values and progress</h3>
                <stemma-range>
                    <label class="range"
                        >Opacity <input type="range" min="0" max="100" value="40" /><output></output
                    ></label>
                </stemma-range>
                <div class="catalog-row">
                    <stemma-stepper
                        ><input type="number" value="1" min="0" max="9" aria-label="Copies"
                    /></stemma-stepper>
                    <stemma-stepper small
                        ><input
                            type="number"
                            value="0.5"
                            min="0"
                            max="1"
                            step="0.1"
                            aria-label="Scale"
                    /></stemma-stepper>
                    <span class="quiet"
                        >Press <kbd class="kbd">⌘</kbd> <kbd class="kbd">K</kbd></span
                    >
                </div>
                <div class="catalog-stack">
                    <progress class="progress" max="100" value="0" data-fills></progress>
                    <progress class="progress progress--success" max="100" value="100"></progress>
                    <progress
                        class="progress progress--danger progress--small"
                        max="100"
                        value="62"
                    ></progress>
                    <progress class="progress" aria-label="Under way"></progress>
                </div>
                <h3 class="label">Navigation</h3>
                <nav class="breadcrumbs" aria-label="Breadcrumbs">
                    <ol>
                        <li><a href="#">Number theory</a></li>
                        <li><a href="#">Congruences</a></li>
                        <li><span aria-current="page">Fermat's little theorem</span></li>
                    </ol>
                </nav>
                <stemma-tabs label="Sections">
                    <div class="tabs">
                        <button class="tabs__tab" value="overview" aria-selected="true">
                            Overview</button
                        ><button class="tabs__tab" value="history">
                            History <span class="count">4</span></button
                        ><button class="tabs__tab" value="settings">Settings</button
                        ><button class="tabs__tab" disabled>Disabled</button>
                    </div>
                    <p class="quiet" data-tab="overview">The overview panel.</p>
                    <p class="quiet" data-tab="history">The history panel.</p>
                    <p class="quiet" data-tab="settings">The settings panel.</p>
                </stemma-tabs>
                <h3 class="label">Chips and counts</h3>
                <div class="catalog-row">
                    <span class="chip">Neutral</span><span class="chip chip--accent">Accent</span>
                    <span class="chip chip--success">Success</span
                    ><span class="chip chip--warning">Warning</span>
                    <span class="chip chip--danger">Danger</span
                    ><span class="chip chip--info">Info</span>
                    <span class="chip chip--dashed">Missing</span>
                </div>
                <div class="catalog-row">
                    <span class="chip chip--outline chip--success">Outline</span>
                    <span class="chip chip--solid chip--accent">Solid</span>
                    <span class="chip chip--indigo">Indigo</span
                    ><span class="chip chip--teal">Teal</span>
                    <span class="chip chip--violet">Violet</span
                    ><span class="chip chip--ochre">Ochre</span>
                    <span class="chip chip--magenta">Magenta</span
                    ><span class="chip chip--olive">Olive</span>
                    <span class="chip chip--cerulean">Cerulean</span
                    ><span class="chip chip--rust">Rust</span>
                </div>
                <div class="catalog-row">
                    <span class="count">12</span><span class="count count--accent">3</span>
                    <span class="count count--solid count--danger">9</span>
                    <span class="avatar">M</span><span class="avatar avatar--teal">E</span>
                    <span class="avatar avatar--square avatar--violet">GR</span>
                    <span class="label">A label</span><span class="quiet numeric">1,024 items</span>
                </div>
                <h3 class="label">Messages</h3>
                <p class="message message--danger">
                    <svg class="glyph" aria-hidden="true">
                        <use href="../targets/web/glyphs.svg#alert" /></svg
                    ><span class="message__text"
                        >Something went wrong. <a href="#">Try again</a>.</span
                    >
                </p>
                <p class="message message--warning" style="margin-top: 8px">
                    <svg class="glyph" aria-hidden="true">
                        <use href="../targets/web/glyphs.svg#warning" /></svg
                    ><span class="message__text">Keep this in mind.</span>
                </p>
                <p class="message message--success" style="margin-top: 8px">
                    <svg class="glyph" aria-hidden="true">
                        <use href="../targets/web/glyphs.svg#done" /></svg
                    ><span class="message__text">Done.</span>
                </p>
                <p class="message message--info" style="margin-top: 8px">
                    <svg class="glyph" aria-hidden="true">
                        <use href="../targets/web/glyphs.svg#info" /></svg
                    ><span class="message__text">Worth knowing.</span
                    ><button class="message__close" aria-label="Dismiss">
                        <svg class="glyph glyph--small" aria-hidden="true">
                            <use href="../targets/web/glyphs.svg#close" />
                        </svg>
                    </button>
                </p>
                <h3 class="label">Cards, tables and disclosure</h3>
                <div class="card">
                    <div class="table" style="--columns: 1fr auto 20px">
                        <div class="table__head">
                            <span>Name</span><span>State</span><span></span>
                        </div>
                        <a class="table__row" href="#"
                            ><span>Fermat's little theorem</span
                            ><span class="chip chip--success">Done</span
                            ><svg class="glyph chevron" aria-hidden="true">
                                <use href="../targets/web/glyphs.svg#chevron-right" /></svg
                        ></a>
                        <a class="table__row" href="#"
                            ><span>Wilson's theorem</span
                            ><span class="chip chip--warning">Open</span
                            ><svg class="glyph chevron" aria-hidden="true">
                                <use href="../targets/web/glyphs.svg#chevron-right" /></svg
                        ></a>
                    </div>
                </div>
                <details class="card disclosure" style="margin-top: 12px" open>
                    <summary>Details</summary>
                    <p class="quiet">What is only wanted now and then.</p>
                </details>
                <div class="card card--empty" style="margin-top: 12px; padding: 20px">
                    <p class="empty">Nothing here yet.</p>
                </div>
                <h3 class="label">Menu, tooltip, segmented control and loading</h3>
                <div class="catalog-row" style="align-items: flex-start">
                    <div class="menu" style="position: static">
                        <p class="menu__heading">Actions</p>
                        <button class="menu__item">
                            <svg class="glyph" aria-hidden="true">
                                <use href="../targets/web/glyphs.svg#edit" /></svg
                            >Rename<span class="menu__hint">R</span>
                        </button>
                        <button class="menu__item" aria-current="true">Current</button>
                        <hr class="menu__separator" />
                        <button class="menu__item menu__item--danger">Delete</button>
                    </div>
                    <div class="catalog-stack">
                        <span class="tooltip">Settings <kbd>⌘,</kbd></span>
                        <div class="segmented">
                            <button aria-pressed="true">List</button><button>Graph</button>
                        </div>
                        <div class="catalog-row">
                            <span class="spinner"></span
                            ><span class="skeleton" style="width: 120px; height: 14px"></span>
                        </div>
                        <span class="wordmark" style="font-size: 28px">stemma</span>
                    </div>
                </div>
                <h3 class="label">Dialog</h3>
                <div
                    class="dialog"
                    style="position: static; display: block; box-shadow: var(--shadow-card)"
                >
                    <div class="dialog__body">
                        <h2 class="dialog__title">Delete this draft?</h2>
                        <p class="dialog__text">It cannot be recovered.</p>
                        <div class="dialog__actions">
                            <button class="button">Cancel</button
                            ><button class="button button--primary button--danger">Delete</button>
                        </div>
                    </div>
                </div>
            </template>

            <div class="catalog-columns">
                <section class="catalog-section" data-density="comfortable" id="comfortable">
                    <h2>Comfortable</h2>
                </section>
                <section class="catalog-section" data-density="compact" id="compact">
                    <h2>Compact</h2>
                </section>
            </div>
            <script type="module">
                const set = document.getElementById("set");
                for (const id of ["comfortable", "compact"])
                    document.getElementById(id).append(set.content.cloneNode(true));
                // A job that fills up, again and again.
                const bars = document.querySelectorAll("[data-fills]");
                let done = 0;
                setInterval(() => {
                    done = done >= 100 ? 0 : Math.min(done + 4 + Math.random() * 10, 100);
                    for (const bar of bars) bar.value = done;
                }, 400);
            </script>
        </main>
    </body>
</html>
