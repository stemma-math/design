<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Stemma design: brand</title>
        <link rel="icon" href="../targets/brand-kit/web/favicon.svg" />
        <link rel="stylesheet" href="../targets/web/index.css" />
        <link rel="stylesheet" href="catalog.css" />
        <script type="module" src="catalog.js"></script>
    </head>
    <body>
        <main class="catalog-main">
            <h1>Brand</h1>
            <p class="lead">
                The brand kit: every mark in each appearance, as SVG and PNG, and the icons. The
                mark has its own usage policy, in the kit's <code class="identifier">LICENSE</code>.
            </p>

            <section class="catalog-section">
                <h2>The symbol</h2>
                <div class="catalog-grid" style="--catalog-cell: 220px">
                    <div class="catalog-kit on-dark">
                        <img
                            src="../targets/brand-kit/svg/symbol-on-dark.svg"
                            alt="The symbol, for dark surfaces"
                        />
                    </div>
                    <div class="catalog-kit on-light">
                        <img
                            src="../targets/brand-kit/svg/symbol-on-light.svg"
                            alt="The symbol, for light surfaces"
                        />
                    </div>
                    <div class="catalog-kit on-light">
                        <img
                            src="../targets/brand-kit/svg/symbol-mono.svg"
                            alt="The symbol, in one colour"
                        />
                    </div>
                </div>
            </section>

            <section class="catalog-section">
                <h2>Wordmark and lockups</h2>
                <div class="catalog-grid" style="--catalog-cell: 340px">
                    <div class="catalog-kit on-dark">
                        <img
                            src="../targets/brand-kit/svg/lockup-horizontal-on-dark.svg"
                            alt="The horizontal lockup, for dark surfaces"
                        />
                    </div>
                    <div class="catalog-kit on-light">
                        <img
                            src="../targets/brand-kit/svg/lockup-horizontal-on-light.svg"
                            alt="The horizontal lockup, for light surfaces"
                        />
                    </div>
                    <div class="catalog-kit on-dark">
                        <img
                            src="../targets/brand-kit/svg/lockup-stacked-on-dark.svg"
                            alt="The stacked lockup, for dark surfaces"
                        />
                    </div>
                    <div class="catalog-kit on-light">
                        <img
                            src="../targets/brand-kit/svg/lockup-stacked-on-light.svg"
                            alt="The stacked lockup, for light surfaces"
                        />
                    </div>
                    <div class="catalog-kit on-light">
                        <img
                            src="../targets/brand-kit/svg/lockup-horizontal-mono.svg"
                            alt="The horizontal lockup, in one colour"
                        />
                    </div>
                    <div class="catalog-kit on-light">
                        <img
                            src="../targets/brand-kit/svg/wordmark-on-light.svg"
                            alt="The wordmark"
                            style="max-height: 48px"
                        />
                    </div>
                </div>
            </section>

            <section class="catalog-section">
                <h2>Icons</h2>
                <div class="catalog-row" style="align-items: end">
                    <img
                        src="../targets/brand-kit/app/icon-256.png"
                        width="128"
                        height="128"
                        alt="The application icon"
                    />
                    <img
                        src="../targets/brand-kit/app/icon-64.png"
                        width="64"
                        height="64"
                        alt="The application icon, 64px"
                    />
                    <img
                        src="../targets/brand-kit/app/icon-32.png"
                        width="32"
                        height="32"
                        alt="The application icon, 32px"
                    />
                    <img
                        src="../targets/brand-kit/app/icon-16.png"
                        width="16"
                        height="16"
                        alt="The application icon, 16px"
                    />
                    <img
                        src="../targets/brand-kit/web/icon-192.png"
                        width="96"
                        height="96"
                        alt="The home-screen icon"
                    />
                    <img
                        src="../targets/brand-kit/web/favicon.svg"
                        width="32"
                        height="32"
                        alt="The favicon"
                    />
                </div>
                <p class="quiet">
                    Every file is listed in the kit's
                    <a class="button button--link" href="../targets/brand-kit/README.md">README</a>.
                </p>
            </section>
        </main>
    </body>
</html>
